{% extends "base.html" %}
{% block title %}Chord Charts — MusicPractice{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="/static/chordfinder/css/chart.css">
{% endblock %}

{% block content %}
<div
  class="chord-search-page"
  :class="groups.length ? 'has-results' : ''"
  x-data="{
    query: '{{ query|escapejs }}',
    groups: {{ groups_json }},
    loading: false,
    error: '',
    timer: null,
    init() {
      if (this.query) this.search();
      this.$watch('query', () => {
        clearTimeout(this.timer);
        this.timer = setTimeout(() => this.search(), 300);
      });
    },
    search() {
      let q = this.query.trim();
      if (q.length < 1) { this.groups = []; this.error = ''; return; }
      this.loading = true;
      this.error = '';
      fetch('/chords/search.json?q=' + encodeURIComponent(q))
        .then(r => r.json())
        .then(d => { this.groups = d.groups; this.loading = false; })
        .catch(() => { this.error = 'Search failed. Try again.'; this.loading = false; });
    }
  }"
>
  <div class="chord-search-header animate-fade-up">
    <h1 class="chord-search-title">Chord Charts</h1>
    <p class="chord-search-subtitle">Search Ultimate Guitar for chords & lyrics</p>
  </div>

  <div class="chord-search-constrain animate-fade-up delay-2">
    <div class="chord-search-form">
      <div class="chord-search-input-wrap">
        <svg class="chord-search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" x-model="query" placeholder="Search song or artist..." class="chord-search-input" autofocus>
      </div>
      <template x-if="loading">
        <div class="chord-search-btn loading"></div>
      </template>
    </div>
  </div>

  <template x-if="error">
    <div class="chord-search-constrain"><div class="chord-error" x-text="error"></div></div>
  </template>

  <template x-if="query && groups.length === 0 && !loading">
    <div class="chord-search-constrain"><div class="chord-empty">
      <p x-text="'No results found for &quot;' + query + '&quot;'"></p>
      <p style="color:var(--studio-muted);font-size:0.875rem;">Try a different spelling or a simpler search</p>
    </div></div>
  </template>

  <div class="chord-artist-columns" x-show="groups.length">
    <template x-for="group in groups" :key="group.artist">
      <div class="chord-artist-col">
        <div class="chord-artist-col-header" x-text="group.artist"></div>
        <div class="chord-artist-col-songs">
          <template x-for="r in group.results" :key="r.url">
            <a :href="'/chords/view/?url=' + encodeURIComponent(r.url)" class="chord-result-card" :style="r.recommended ? 'border-color:var(--studio-amber);background:rgba(217,119,6,0.04);' : ''">
              <span class="chord-result-title">
                <span x-text="r.title"></span>
                <span class="chord-recommended-badge" x-show="r.recommended">★</span>
              </span>
              <span class="chord-result-meta">
                <span class="chord-key-badge" x-show="r.key" x-text="r.key"></span>
                <span x-text="r.votes ? r.votes + ' votes' : ''"></span>
                <span class="chord-result-rating" x-show="r.rating" x-text="r.rating"></span>
              </span>
            </a>
          </template>
        </div>
      </div>
    </template>
  </div>
</div>
{% endblock %}
