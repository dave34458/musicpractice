{% extends "base.html" %}
{% block title %}Password Reset Complete{% endblock %}
{% block content %}
<div class="animate-fade-up" style="max-width:480px;margin:1.5rem auto;padding:0 1rem;">
  <div style="background:var(--studio-panel);border:1px solid var(--studio-border);border-radius:var(--radius-lg);padding:2rem;text-align:center;">
    <h1 style="font-family:var(--font-display);font-size:1rem;font-weight:700;margin:0 0 0.5rem;">Password Reset Complete</h1>
    <p style="font-size:0.8125rem;color:var(--studio-muted);margin-bottom:1.5rem;">Your password has been set. You can now log in with your new password.</p>
    <a href="/login/" style="display:inline-flex;padding:0.5rem 1rem;border-radius:var(--radius-sm);font-size:0.75rem;font-weight:600;background:var(--studio-amber);color:#fff;text-decoration:none;box-shadow:var(--studio-glow-amber);">Log In</a>
  </div>
</div>
{% endblock %}
